# /etc/fail2ban/filter.d/ssd-klinika-auth.conf
# API /auth/login dan 401/429 javoblarini pino-http log'idan oladi.
# Log format (pino-http serializer): "url":"/auth/login" + "ip":"X.X.X.X" + "statusCode":401|429
[Definition]
failregex = .*"url":"/auth/login".*"ip":"<HOST>".*"statusCode":(401|429).*
          = .*"ip":"<HOST>".*"url":"/auth/login".*"statusCode":(401|429).*
ignoreregex =
