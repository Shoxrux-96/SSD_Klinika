# /etc/fail2ban/jail.d/ssd-klinika.conf
# install.sh ushbu faylni avtomatik ko'chiradi.

[DEFAULT]
# Umumiy sozlamalar
bantime  = 1h
findtime = 10m
maxretry = 10
backend  = systemd

# SSH brute-force (standart)
[sshd]
enabled = true
mode    = aggressive
maxretry = 5

# Nginx 429 va 4xx scanlar
[nginx-req-limit]
enabled = true
filter  = nginx-req-limit
logpath = /var/log/nginx/ssd-klinika.error.log
maxretry = 10
findtime = 5m
bantime  = 1h

[nginx-bad-request]
enabled = true
filter  = nginx-bad-request
logpath = /var/log/nginx/ssd-klinika.access.log
maxretry = 30
findtime = 5m
bantime  = 2h

# Klinika API /auth/login brute-force (pino journal orqali)
[ssd-klinika-auth]
enabled  = true
filter   = ssd-klinika-auth
backend  = systemd
journalmatch = _SYSTEMD_UNIT=ssd-klinika-api.service
maxretry = 8
findtime = 10m
bantime  = 2h
